[project]
name = "fmex"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Ryota Murai", email = "opensource@rmurai.com" }
]
requires-python = ">=3.11"
dependencies = [
    "av>=16.0.0",
    "diskcache>=5.6.3",
    "pillow>=12.1.1",
    "textual>=7.5.0",
    "textual-image>=0.8.5",
    "typer>=0.23.1",
]

[project.scripts]
fmex = "fmex.cli:main"

[build-system]
requires = ["uv_build>=0.10.2,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=1.19.1",
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "ruff>=0.15.1",
]

[tool.pytest.ini_options]
markers = [
    "performance: performance-sensitive tests",
]
