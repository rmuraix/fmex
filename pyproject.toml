[project]
name = "fmex"
version = "0.1.1"
description = "Terminal-based frame extractor for video files."
readme = "README.md"
license-files = ["LICENSE"]
authors = [
    { name = "Ryota Murai", email = "opensource@rmurai.com" }
]
keywords = ["frame extraction", "video processing", "terminal application"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
]
requires-python = ">=3.11"
dependencies = [
    "av>=16.0.0",
    "diskcache>=5.6.3",
    "pillow>=12.1.1",
    "textual>=7.5.0",
    "textual-image>=0.8.5",
    "typer>=0.23.1",
]


[project.urls]
Homepage = "https://github.com/rmuraix/fmex"
Documentation = "https://github.com/rmuraix/fmex#readme"
Repository = "https://github.com/rmuraix/fmex.git"
Issues = "https://github.com/rmuraix/fmex/issues"
Changelog = "https://github.com/rmuraix/fmex/releases"

[project.scripts]
fmex = "fmex.cli:main"

[build-system]
requires = ["uv_build>=0.11.16,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=1.19.1",
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "ruff>=0.15.1",
]

[tool.pytest.ini_options]
addopts = "--cov --cov-branch --cov-report=xml"
markers = [
    "performance: performance-sensitive tests",
]
